<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <style>text{font-family:'Poppins',Arial,Helvetica,sans-serif}</style>
  <!-- Celonis short wordmark: icon mark + wordmark -->
  <g transform="translate(24,30)">
    <!-- Outer ring: gap at ~5 o'clock (120°–180°) -->
    <path d="M0,20 A20,20 0 1,1 17.32,10" fill="none" stroke="#000000" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Middle ring: gap at ~11 o'clock (300°–360°) -->
    <path d="M0,-14 A14,14 0 1,1 -12.12,-7" fill="none" stroke="#000000" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Inner ring: gap at ~8 o'clock (210°–270°) -->
    <path d="M-8,0 A8,8 0 1,1 -4,6.93" fill="none" stroke="#000000" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="2" fill="#000000"/>
  </g>
  <!-- Wordmark -->
  <text x="54" y="37" font-size="28" font-weight="600" fill="#000000" letter-spacing="-0.5">celonis</text>
</svg>
