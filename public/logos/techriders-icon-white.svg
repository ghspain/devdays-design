<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- TechRiders icon - stylized motorcycle rider silhouette - white variant -->
  <g transform="translate(0,2)">
    <!-- Motorcycle body -->
    <path d="M6 30 C6 30, 10 22, 18 20 C26 18, 30 24, 32 26 C34 28, 34 30, 32 32 L6 32 Z" fill="#ffffff"/>
    <!-- Rider torso -->
    <path d="M12 20 C12 16, 16 10, 20 10 L24 10 C26 10, 28 12, 28 14 L28 20 Z" fill="#ffffff"/>
    <!-- Rider head/helmet -->
    <circle cx="24" cy="6" r="5" fill="#ffffff"/>
    <!-- Front wheel -->
    <circle cx="6" cy="34" r="6" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="6" cy="34" r="1.5" fill="#ffffff"/>
    <!-- Rear wheel -->
    <circle cx="32" cy="34" r="6" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="32" cy="34" r="1.5" fill="#ffffff"/>
    <!-- Wheel spokes front -->
    <line x1="6" y1="28" x2="6" y2="40" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="0" y1="34" x2="12" y2="34" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Wheel spokes rear -->
    <line x1="32" y1="28" x2="32" y2="40" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="26" y1="34" x2="38" y2="34" stroke="#ffffff" stroke-width="0.8"/>
  </g>
</svg>