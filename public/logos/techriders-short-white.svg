<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56">
  <!-- TechRiders short logo - motorcycle rider silhouette + wordmark - white variant -->
  <g transform="translate(4,4)">
    <!-- Motorcycle body -->
    <path d="M8 34 C8 34, 12 26, 20 24 C28 22, 32 28, 34 30 C36 32, 36 34, 34 36 L8 36 Z" fill="#ffffff"/>
    <!-- Rider torso -->
    <path d="M14 24 C14 20, 18 14, 22 14 L26 14 C28 14, 30 16, 30 18 L30 24 Z" fill="#ffffff"/>
    <!-- Rider head/helmet -->
    <circle cx="26" cy="10" r="5" fill="#ffffff"/>
    <!-- Front wheel -->
    <circle cx="8" cy="38" r="6" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="8" cy="38" r="1.5" fill="#ffffff"/>
    <!-- Rear wheel -->
    <circle cx="34" cy="38" r="6" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="34" cy="38" r="1.5" fill="#ffffff"/>
    <!-- Wheel spokes front -->
    <line x1="8" y1="32" x2="8" y2="44" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="2" y1="38" x2="14" y2="38" stroke="#ffffff" stroke-width="0.8"/>
    <!-- Wheel spokes rear -->
    <line x1="34" y1="32" x2="34" y2="44" stroke="#ffffff" stroke-width="0.8"/>
    <line x1="28" y1="38" x2="40" y2="38" stroke="#ffffff" stroke-width="0.8"/>
  </g>
  <!-- Wordmark -->
  <text x="54" y="35" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="-0.5">TechRiders</text>
</svg>