<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Celonis brand mark: concentric arcs with gaps -->
  <!-- Outer ring: gap at ~5 o'clock (120°–180°) -->
  <path d="M24,44 A20,20 0 1,1 41.32,34" fill="none" stroke="#000000" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Middle ring: gap at ~11 o'clock (300°–360°) -->
  <path d="M24,10 A14,14 0 1,1 11.88,17" fill="none" stroke="#000000" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Inner ring: gap at ~8 o'clock (210°–270°) -->
  <path d="M16,24 A8,8 0 1,1 20,30.93" fill="none" stroke="#000000" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="24" cy="24" r="2" fill="#000000"/>
</svg>
